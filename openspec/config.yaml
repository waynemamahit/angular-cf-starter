  ## Internationalization (i18n)

  ### Centralized References

  - **Frontend**: `react-i18next` with translations in `src/i18n/locales/`
  - **Backend**: `i18next` with Hono integration in `src/server/i18n/`
  - **Shared keys** where applicable — keep translation keys consistent across frontend and backend

  ### Translation Structure

  ```
  src/i18n/
  ├── config.ts           # i18next configuration (language detection, fallback)
  └── locales/
      ├── en/
      │   ├── common.json      # Shared UI labels, buttons, navigation
      │   ├── errors.json      # Error messages
      │   └── validation.json  # Form validation messages
      └── id/
          ├── common.json
          ├── errors.json
          └── validation.json

  src/server/i18n/
  ├── config.ts           # Backend i18next configuration
  └── locales/
      ├── en.json          # API error messages, notifications
      └── id.json
  ```

  ### Theme & Language Selector

  - Built into the main layout component (visible on all pages, typically `src/routes/__root.tsx`)
  - **Theme selector**: DaisyUI theme switcher using `data-theme` attribute
  - **Language selector**: i18next language switch with flag icons (Lucide React)
  - **Persistence**: localStorage for theme, localStorage + cookie for language
  - **Accessible**: Keyboard-navigable dropdowns with ARIA attributes
  - **Default theme**: `light` (set via `--default` flag in DaisyUI config)

  ---

  ## UI/UX Patterns

  ### Semantic HTML & Accessibility

  - **Semantic elements**: `<main>`, `<nav>`, `<article>`, `<section>`, `<header>`, `<footer>`, `<aside>`
  - **ARIA roles**: Proper roles for interactive elements, live regions for dynamic content
  - **Keyboard navigation**: All interactions keyboard-accessible (Tab, Enter, Escape, Arrow keys)
  - **Focus management**: Visible focus indicators, focus trapping in modals
  - **Screen reader support**: Descriptive labels, `aria-label`, `aria-describedby`, `aria-live`
  - **Skip links**: "Skip to main content" link as first focusable element
  - **Color contrast**: Minimum WCAG 2.1 AA contrast ratios via DaisyUI theme tokens

  ```tsx
  // ✅ CORRECT: Semantic HTML with ARIA
  <a href="#main-content" className="sr-only focus:not-sr-only">
    Skip to main content
  </a>
  <header role="banner">
    <nav aria-label="Primary navigation">
      {/* Navigation items */}
    </nav>
  </header>
  <main id="main-content" role="main" aria-label="Main content">
    <section aria-labelledby="section-heading">
      <h2 id="section-heading">Section Title</h2>
      {/* Content */}
    </section>
  </main>
  ```

  ### Form Layouts

  - Follow [TailwindCSS Form Layouts](https://tailwindcss.com/plus/ui-blocks/application-ui/forms/form-layouts)
  - **Mobile-first responsive**: Stack on mobile, grid on desktop
  - **Proper label associations**: `<label htmlFor="...">` on every input
  - **Error state handling**: Clear inline error messages with `aria-invalid` and `aria-describedby`
  - **Loading states**: Visual feedback with disabled state and spinner
  - **Validation**: Client-side Zod validation + server-side validation in actions / TanStack Server Functions

  ### Custom Components (DaisyUI-based)

  Define custom components based on requirements and use cases:

  | Component       | Base            | Features                                             |
  | --------------- | --------------- | ---------------------------------------------------- |
  | **Toast**       | DaisyUI toast   | Auto-dismiss, stacking, severity levels, accessible  |
  | **Modal**       | DaisyUI modal   | Focus trap, Escape to close, ARIA dialog role        |
  | **Carousel**    | DaisyUI carousel| Keyboard nav, swipe, auto-play with pause            |
  | **Dropdown**    | DaisyUI dropdown| Keyboard nav, ARIA listbox/menu, click outside close |

  All custom components must:
  - Have unit tests (React Testing Library)
  - Support keyboard navigation
  - Include proper ARIA attributes
  - Be responsive (mobile-first TailwindCSS 4+)

  ### DaisyUI Theming

  - **Default theme**: `light`
  - **Configuration** in `src/styles.css` (Tailwind V4 DaisyUI usage):

  ```css
  @import "tailwindcss";
  @plugin "daisyui" {
    themes: light --default, dark --prefersdark, cupcake, corporate, dracula;
  }
  ```

  ---

  ## Realtime Features

  ### WebSocket / SSE Selection Guide

  - Use **Durable Objects** for all stateful realtime connections
  - Use **KV** for communication between Durable Object instances (queue coordination)
  - Choose protocol based on requirements:
    - **WebSocket**: Bidirectional (Chat, gaming)
    - **SSE**: Server-to-Client only (Notifications, feeds)

  ---

  ## Testing Strategy

  ### Coverage Requirements

  - **Minimum coverage: 90%** for all metrics (statements, branches, functions, lines)
  - **All tests must pass** before merging to `main`
  - **Coverage enforced** via Vitest v8 coverage provider (`vitest.config.ts`)

  ```typescript
  // vitest.config.ts — enforce 90% coverage thresholds
  export default defineConfig({
    plugins: [react(), tsconfigPaths()],
    test: {
      globals: true,
      environment: "jsdom",
      setupFiles: ["./vitest.setup.ts"],
      exclude: ["node_modules/", "coverage/", "dist/", "e2e/", "vitest.setup.ts"],
      coverage: {
        provider: "v8",
        reporter: ["text", "json", "html"],
        thresholds: {
          statements: 90,
          branches: 90,
          functions: 90,
          lines: 90,
        },
        exclude: ["node_modules/", "coverage/", "dist/", "e2e/", "vitest.setup.ts"],
      },
    },
  });
  ```

  ### Test Types and Tools

  | Type              | Tool                     | File Pattern                   | Scope                          |
  | ----------------- | ------------------------ | ------------------------------ | ------------------------------ |
  | **Unit**          | Vitest + RTL             | `*.test.ts`, `*.test.tsx`      | Components, services, utils    |
  | **Integration**   | Vitest + Hono test client| `*.integration.test.ts`        | API endpoints, server functions|
  | **End-to-End**    | Playwright               | `e2e/*.spec.ts`                | Full user flows across browsers|

  ### Integration Testing & Mocking

  - **Proper Mocking**: Implement proper mocking for integration testing, including databases (D1, Hyperdrive) and external services if needed. Use Awilix dependency injection to effortlessly substitute interface dependencies with mocks.
  - **Comprehensive Coverage**: Ensure integration test coverage validates both components and API endpoints extensively to make sure features and specifications run properly.

  ### Playwright E2E Data Prefix Convention

  **All data input in Playwright E2E tests MUST use the prefix `from Playwright-E2E`.**

  This ensures developers can distinguish between automated and manual test data.

  ```typescript
  // e2e/helpers/test-data.ts
  const E2E_PREFIX = "from Playwright-E2E";

  export function e2eData(value: string): string {
    return `${E2E_PREFIX} ${value}`;
  }
  ```

