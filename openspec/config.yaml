  ## Cloudflare Service Selection Guide

  | Requirement                     | Service              | Why                                       |
  | ------------------------------- | -------------------- | ----------------------------------------- |
  | Primary edge data storage       | D1                   | Low-latency SQLite at edge                |
  | External PostgreSQL             | Hyperdrive           | Connection pooling, reduced latency       |
  | Caching, sessions               | KV                   | Global, fast key-value                    |
  | File/object storage             | R2                   | S3-compatible, no egress fees             |
  | Real-time bidirectional         | Durable Objects + WS | Stateful WebSocket connections            |
  | Real-time server push           | Durable Objects + SSE| One-way server-to-client updates          |
  | ML embeddings/similarity search | Vectorize            | Vector similarity search                  |
  | AI inference/automation         | Workers AI           | Edge ML models                            |
  | Real-time queues / background   | DO + KV              | Durable Objects combined with KV for communication in other DO queues |

  **Note**: Ensure all Cloudflare service configs (D1, Hyperdrive, KV, R2, DO, Vector, Workers AI) can be tested properly in the local development environment using Wrangler. Always choose the best Cloudflare service based on the specific requirements and use cases needed.

  ---

  ## Important Constraints

  1. **TypeScript Strictness**: No `any` type usage — use `unknown`, generics, or type narrowing
  2. **Test Coverage**: Minimum 90% coverage enforced via Vitest v8
  3. **Architecture**: UI Layer -> Route -> Engine -> Service Layer
  4. **Security Requirements**: CSRF on mutations, CORS origins configurable via `wrangler.jsonc`
  5. **Cloudflare Compatibility**: All backend code must run on Workers runtime (`nodejs_compat` flag enabled)
  6. **Angular Paradigm**: Follow best practices ([security](https://angular.dev/best-practices/security#best-practices), [routing](https://angular.dev/guide/routing/testing#best-practices-for-router-testing), [forms](https://angular.dev/guide/forms/signals/model-design#form-model-best-practices), [async](https://angular.dev/guide/forms/signals/async-operations#best-practices), [resolvers](https://angular.dev/guide/routing/data-resolvers#best-practices)). Use standalone components, signals, `OnPush`, lazy-loaded routes, and Angular built-in DI.
  7. **No Awilix on Frontend** — Use Angular built-in DI (`@Injectable`, `inject()`, `providedIn`)
  8. **Accessibility** — Must pass all AXE checks and meet WCAG AA minimums

