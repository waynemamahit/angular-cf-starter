  ## Security Patterns

  ### Angular Security Best Practices

  Follow https://angular.dev/best-practices/security#best-practices:

  - **Sanitize user input** — Angular auto-sanitizes by default; never bypass with `bypassSecurityTrust*` unless absolutely necessary
  - **Avoid `innerHTML`** — Use Angular template bindings instead
  - **Content Security Policy** — Configure CSP headers via Hono middleware
  - **CSRF tokens** — Frontend HTTP interceptor attaches CSRF-related headers

  ### CSRF Protection

  - **Required for all mutations**: POST, PUT, PATCH, DELETE
  - Implemented via Hono's built-in `csrf()` middleware in `src/server/app.ts`
  - Origin-based validation — checks request origin against allowed origins
  - Applied globally before route handlers
  - **Frontend interceptor** — Angular HTTP interceptor for CSRF header injection

  ```typescript
  // src/server/app.ts — CSRF applied globally
  import { csrf } from 'hono/csrf';

  app.use('*', csrf({
    origin: (origin, c) => {
      const allowedOrigins = (c.env.CORS_ALLOWED_ORIGINS as string[] | undefined) ?? ['http://localhost:4200'];
      return allowedOrigins.includes(origin);
    },
  }));
  ```

  **Verification in tests:**

  - Integration tests MUST verify CSRF protection rejects requests without valid origin

  ### CORS Protection

  - **Configurable origins** via `wrangler.jsonc` variables or `.dev.vars`
  - Applied to `*` or API routes globally by `src/server/app.ts`
  - Supports comma-separated origin list for multiple domains

  ```typescript
  // src/server/app.ts — CORS on API routes
  import { cors } from 'hono/cors';

  app.use('/api/*', cors({
    origin: (origin, c) => {
      const allowed = (c.env.CORS_ALLOWED_ORIGINS as string[] | undefined) ?? ['http://localhost:4200'];
      return allowed.includes(origin) ? origin : '';
    },
    credentials: true,
    allowMethods: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS'],
    allowHeaders: ['Content-Type', 'Authorization', 'X-Correlation-Id'],
  }));
  ```

  ### Rate Limiting

  - Configured via Cloudflare `RateLimit` bindings in `wrangler.jsonc`
  - Two tiers typically: `LONG_RATE_LIMITER` (100 req/60s) and `SHORT_RATE_LIMITER` (20 req/10s)
  - Applied via `hono-rate-limiter` middleware with `cf-connecting-ip` key

  ### Secure Headers

  - Applied globally via `hono/secure-headers` middleware
  - Includes CSP, X-Frame-Options, X-Content-Type-Options, etc.

  ### Sensitive Data Handling

  - **Never log sensitive data** — Logger service sanitizes automatically
  - **Environment variables** for secrets — use `.dev.vars` locally, Wrangler secrets in production
  - **No hardcoded credentials** in codebase
  - **Wrangler types** auto-generated — run `pnpm typecheck` (calls `wrangler types`) to update `worker-configuration.d.ts`

