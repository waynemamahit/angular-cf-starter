  ## Project Conventions

  ### Code Style

  #### TypeScript Standards

  - **Strict mode enabled** — `strict: true` in all tsconfig files
  - **No `any` type** — Use proper types, `unknown`, generics, or type narrowing
  - **Explicit return types** — All exported functions must have explicit return types
  - **Interface-first design** — Define interfaces before implementations
  - **Proper type organization** — Centralize types in dedicated `types/` directories
  - **No implicit any** — `noImplicitAny: true` enforced via strict mode

  ```typescript
  // ✅ CORRECT: Explicit types, interface-based, type-only imports
  import type { User, CreateUserInput } from '../types/user.types';

  interface UserService {
    findById(id: string): Promise<User | null>;
    create(data: CreateUserInput): Promise<User>;
  }

  // ❌ WRONG: any type, implicit returns
  function getUser(id: any) {
    return db.query(id);
  }
  ```

  #### Type Organization

  ```
  src/app/types/       # Frontend-specific types
  src/server/types/    # Backend-specific types
  shared/types/        # Shared types (frontend + backend)
  ```

  - **Interfaces** — For object shapes, service contracts, and DI bindings
  - **Types** — For unions, intersections, mapped types, and aliases
  - **Enums** — Prefer `as const` objects or string literal unions over enums
  - **Classes** — Only when behavior encapsulation is needed (e.g., Durable Objects, Angular services)

  ```typescript
  // ✅ PREFERRED: const object over enum
  export const UserStatus = {
    Active: 'active',
    Inactive: 'inactive',
    Suspended: 'suspended',
  } as const;
  export type UserStatus = (typeof UserStatus)[keyof typeof UserStatus];
  ```

  #### Angular Component Standards

  - **Always standalone components** — Do NOT set `standalone: true` (default in Angular v20+)
  - **Signals for state** — Use `signal()`, `computed()`, `input()`, `output()`
  - **OnPush change detection** — Set `changeDetection: ChangeDetectionStrategy.OnPush` in all components
  - **No `@HostBinding` / `@HostListener`** — Use `host` object in `@Component`/`@Directive`
  - **No `ngClass` / `ngStyle`** — Use `[class.*]` and `[style.*]` bindings
  - **Native control flow** — Use `@if`, `@for`, `@switch` instead of `*ngIf`, `*ngFor`, `*ngSwitch`
  - **Reactive forms** — Prefer Reactive forms over Template-driven forms
  - **`inject()` function** — Use `inject()` instead of constructor injection
  - **`NgOptimizedImage`** — Use for all static images (not for inline base64)
  - **Inline templates** — Prefer for small components; external templates for larger ones
  - **Relative paths** — Use paths relative to the component TS file for external templates/styles
  - **No arrow functions in templates** — They are not supported in Angular templates
  - **Security best practices** — Follow https://angular.dev/best-practices/security#best-practices

  ```typescript
  // ✅ CORRECT: Angular standalone component with signals and OnPush
  import { ChangeDetectionStrategy, Component, computed, input, output } from '@angular/core';

  @Component({
    selector: 'app-user-card',
    changeDetection: ChangeDetectionStrategy.OnPush,
    template: `
      <article class="card bg-base-100 shadow-xl">
        <div class="card-body">
          <h2 class="card-title">{{ fullName() }}</h2>
          <p>{{ email() }}</p>
          <div class="card-actions justify-end">
            <button class="btn btn-primary" (click)="selected.emit(userId())">
              Select
            </button>
          </div>
        </div>
      </article>
    `,
  })
  export class UserCardComponent {
    readonly userId = input.required<string>();
    readonly firstName = input.required<string>();
    readonly lastName = input.required<string>();
    readonly email = input.required<string>();
    readonly selected = output<string>();

    protected readonly fullName = computed(() => `${this.firstName()} ${this.lastName()}`);
  }
  ```

  #### Naming Conventions

  | Element              | Convention                   | Example                              |
  | -------------------- | ---------------------------- | ------------------------------------ |
  | **Files**            | `kebab-case.ts`              | `user-profile.component.ts`          |
  | **Components**       | `PascalCase` + `Component`   | `UserProfileComponent`               |
  | **Services**         | `PascalCase` + `Service`     | `UserApiService`                     |
  | **Guards**           | `camelCase` + function       | `authGuard`                          |
  | **Interceptors**     | `camelCase` + function       | `csrfInterceptor`                    |
  | **Pipes**            | `PascalCase` + `Pipe`        | `DateFormatPipe`                     |
  | **Directives**       | `PascalCase` + `Directive`   | `HighlightDirective`                 |
  | **Functions**        | `camelCase`                  | `getUserById`                        |
  | **Variables**        | `camelCase`                  | `userName`                           |
  | **Constants**        | `SCREAMING_SNAKE_CASE`       | `MAX_RETRY_COUNT`                    |
  | **Interfaces**       | `PascalCase` (no `I` prefix for frontend) | `UserService`             |
  | **Types**            | `PascalCase`                 | `UserRole`                           |
  | **Enums/Const**      | `PascalCase`                 | `UserStatus.Active`                  |
  | **DO Classes**       | `PascalCase`                 | `Counter`                            |
  | **Selectors**        | `app-kebab-case`             | `app-user-profile`                   |

  #### Import Order (enforced by ESLint)

  1. Angular packages (`@angular/*`)
  2. Third-party packages (`rxjs`, `hono`, `zod`, `i18next`, etc.)
  3. Shared imports (`shared/`)
  4. Relative imports (`./`, `../`)
  5. Type-only imports (`import type { ... }`)

  ### Formatting Rules (ESLint + Prettier)

  **ESLint** (`eslint.config.js`):

  - `angular-eslint` recommended rules for TypeScript and templates
  - `typescript-eslint` recommended + stylistic rules
  - Template accessibility rules enabled (`angular.configs.templateAccessibility`)
  - Component selector: `app-` prefix, `kebab-case`
  - Directive selector: `app` prefix, `camelCase`

  **Prettier** (configured in `package.json`):

  - **Print width**: 100
  - **Quotes**: Single quotes
  - **Angular HTML parser**: Override for `.html` files
  - **Semicolons**: Always (default)
  - **Trailing commas**: All (ES2022+)

