  ## Testing Strategy

  ### Coverage Requirements

  - **Minimum coverage: 90%** for all metrics (statements, branches, functions, lines)
  - **All tests must pass** before merging to `main`
  - **Coverage enforced** via Vitest v8 coverage provider (`vitest.config.ts`)

  ```typescript
  // vitest.config.ts — referenced by angular.json test architect
  import { playwright } from '@vitest/browser-playwright';
  import { defineConfig } from 'vitest/config';

  const exclude = ['node_modules/', 'coverage/', 'dist/', 'e2e/'];

  export default defineConfig({
    test: {
      browser: {
        provider: playwright(),
        instances: [{ browser: 'chromium' }],
      },
      globals: true,
      environment: 'jsdom',
      exclude,
      coverage: {
        provider: 'v8',
        reporter: ['text', 'json', 'html'],
        thresholds: {
          statements: 90,
          branches: 90,
          functions: 90,
          lines: 90,
        },
        exclude,
      },
    },
  });
  ```

  ### Test Types and Tools

  | Type              | Tool                     | File Pattern                   | Scope                          |
  | ----------------- | ------------------------ | ------------------------------ | ------------------------------ |
  | **Unit**          | Vitest + Angular TestBed | `*.spec.ts`                    | Components, services, utils    |
  | **Integration**   | Vitest + Hono test client| `*.integration.spec.ts`        | API endpoints, resolvers       |
  | **End-to-End**    | Playwright               | `e2e/*.spec.ts`                | Full user flows across browsers|

  ### Angular Component Testing

  ```typescript
  // ✅ CORRECT: Angular component test with Vitest + TestBed
  import { ComponentFixture, TestBed } from '@angular/core/testing';
  import { UserCardComponent } from './user-card.component';

  describe('UserCardComponent', () => {
    let component: UserCardComponent;
    let fixture: ComponentFixture<UserCardComponent>;

    beforeEach(async () => {
      await TestBed.configureTestingModule({
        imports: [UserCardComponent],
      }).compileComponents();

      fixture = TestBed.createComponent(UserCardComponent);
      fixture.componentRef.setInput('userId', '1');
      fixture.componentRef.setInput('firstName', 'John');
      fixture.componentRef.setInput('lastName', 'Doe');
      fixture.componentRef.setInput('email', 'john@example.com');
      component = fixture.componentInstance;
      fixture.detectChanges();
    });

    it('should display full name', () => {
      const element: HTMLElement = fixture.nativeElement;
      expect(element.querySelector('.card-title')?.textContent).toContain('John Doe');
    });
  });
  ```

  ### Router Testing

  Follow [Angular router testing best practices](https://angular.dev/guide/routing/testing#best-practices-for-router-testing):

  - Use `RouterTestingHarness` for route component testing
  - Test guards and resolvers in isolation
  - Verify navigation triggers correct component loading

  ### Integration Testing & Mocking

  - **Proper Mocking**: Use Awilix dependency injection to substitute interface dependencies with mocks for backend API testing
  - **Angular TestBed**: Override providers for frontend component/service mocking
  - **Comprehensive Coverage**: Ensure integration test coverage validates both components and API endpoints

  ### Playwright E2E Data Prefix Convention

  **All data input in Playwright E2E tests MUST use the prefix `from Playwright-E2E`.**

  This ensures developers can distinguish between automated and manual test data.

  ```typescript
  // e2e/helpers/test-data.ts
  const E2E_PREFIX = 'from Playwright-E2E';

  export function e2eData(value: string): string {
    return `${E2E_PREFIX} ${value}`;
  }
  ```

