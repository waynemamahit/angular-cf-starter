  ## Git Workflow

  ### Branch Strategy

  - `main` — Production-ready code
  - `dev` — Integration branch
  - `feat/*` — Feature development
  - `fix/*` — Bug fixes

  ### Commit Conventions

  Follow [Conventional Commits](https://www.conventionalcommits.org/):
  `<type>(<scope>): <description>`

  ---

  ## Cloudflare Service Selection Guide

  | Requirement                     | Service              | Why                                       |
  | ------------------------------- | -------------------- | ----------------------------------------- |
  | Primary edge data storage       | D1                   | Low-latency SQLite at edge                |
  | External PostgreSQL             | Hyperdrive           | Connection pooling, reduced latency       |
  | Caching, sessions               | KV                   | Global, fast key-value                    |
  | File/object storage             | R2                   | S3-compatible, no egress fees             |
  | Real-time bidirectional         | Durable Objects + WS | Stateful WebSocket connections            |
  | Real-time server push           | Durable Objects + SSE| One-way server-to-client updates          |
  | ML embeddings/similarity search | Vectorize            | Vector similarity search                  |
  | AI inference/automation         | Workers AI           | Edge ML models                            |
  | Real-time queues / background   | DO + KV              | Durable Objects combined with KV for communication in other DO queues |

  **Note**: Ensure all Cloudflare service configs (D1, Hyperdrive, KV, R2, DO, Vector, Workers AI) can be tested properly in the local development environment using Wrangler. Always choose the best Cloudflare service based on the specific requirements and use cases needed.

  ---

  ## Important Constraints

  1. **TypeScript Strictness**: No `any` type usage
  2. **Test Coverage**: Minimum 90% coverage
  3. **Architecture**: UI Layer -> Route -> Engine -> Service Layer
  4. **Security Requirements**: CSRF on mutations, CORS origins
  5. **Cloudflare Compatibility**: All code must run on the Workers runtime (no Node.js native unless polyfilled)
  6. **TanStack Start Paradigm**: Follow best practices and patterns ([reference](https://tanstack.com/start/latest/docs/framework/react)). Utilize Server Functions (`createServerFn`), file-based routing (`src/routes`), loaders, and loaders data pattern.

# Per-artifact rules
rules:
  proposal:
    - "Focus on the 'Why' and user value"
    - "Keep proposals under 500 words"
  design:
    - "Focus on the 'How' and architecture"
    - "Follow Clean Architecture patterns (Engine + Service)"
    - "Specify Cloudflare services usage"
  tasks:
    - "Break tasks into atomic, verifiable chunks (max 2 hours)"
    - "Include E2E data prefix notes (from Playwright-E2E)"
  spec:
    - "Must be the source of truth for the capability"
    - "Include API + Schema mapping"
